name: Build and Publish Dashboard

on:
  schedule:
    # Hourly. GitHub's scheduler is best-effort, so expect the occasional
    # run to land 10-20 minutes late - fine for an hourly sales board.
    - cron: '0 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]        # republish whenever you tweak the script

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Install Mercari support (optional)
        # dashboard.py degrades gracefully to Yahoo-only if this is missing,
        # so a failure here must not sink the whole build.
        continue-on-error: true
        run: pip install mercari

      - name: Show environment
        run: |
          python --version
          pip list

      - name: Build the dashboard
        run: |
          set -o pipefail
          python dashboard.py 2>&1 | tee build.log

      - name: Diagnostics
        if: always()
        run: |
          echo "===== per-source counts ====="
          grep -E "unique listings|qualifying|Mercari|not installed|failed" build.log || echo "(no matching log lines)"
          echo
          echo "===== output file ====="
          if [ -f index.html ]; then
            echo "index.html size: $(wc -c < index.html) bytes"
            echo "row count: $(grep -o 'class=\"row\"' index.html | wc -l)"
          else
            echo "index.html was never created"
          fi
          echo
          echo "===== last 40 log lines ====="
          tail -n 40 build.log || echo "(no build.log)"

      - name: Verify the build produced real data
        # If both sources block the runner, dashboard.py still writes a valid
        # but nearly-empty page. Failing here means the previous deployment
        # stays live instead of being replaced by an empty board.
        run: |
          ROWS=$(grep -o 'class="row"' index.html | wc -l)
          echo "Rows in output: $ROWS"
          if [ "$ROWS" -lt 5 ]; then
            echo "::error::Only $ROWS rows scraped - refusing to publish. Keeping the last good deploy."
            exit 1
          fi

      - name: Assemble the site folder
        run: |
          mkdir -p public
          cp index.html public/
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
