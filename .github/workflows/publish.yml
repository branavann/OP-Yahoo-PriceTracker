name: Build and Publish Dashboard

on:
  schedule:
    # Hourly. GitHub's scheduler is best-effort, so expect the occasional
    # run to land 10-20 minutes late - fine for an hourly sales board.
    - cron: '0 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]        # republish whenever you tweak the script
    paths-ignore:
      - 'data/**'           # the archive commit must not retrigger this run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history: the archive commit rebases onto whatever landed
          # while the scrape was running, and rebasing a shallow clone fails.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Install Mercari support (optional)
        # dashboard.py degrades gracefully to Yahoo-only if this is missing,
        # so a failure here must not sink the whole build.
        continue-on-error: true
        run: pip install mercari

      - name: Show environment
        run: |
          python --version
          pip list

      - name: Build the dashboard
        # dashboard.py reads template.html from the repo root and injects the
        # scraped data into it, so both files must be present.
        run: |
          set -o pipefail
          test -f template.html || { echo "::error::template.html is missing from the repo"; exit 1; }
          python dashboard.py 2>&1 | tee build.log

      - name: Diagnostics
        if: always()
        run: |
          echo "===== per-source counts ====="
          grep -E "unique listings|qualifying|Mercari|not installed|failed" build.log || echo "(no matching log lines)"
          echo
          echo "===== output file ====="
          if [ -f index.html ]; then
            echo "index.html size: $(wc -c < index.html) bytes"
            echo "payload items: $(grep -o '"id":' index.html | wc -l)"
          else
            echo "index.html was never created"
          fi
          echo
          echo "===== last 40 log lines ====="
          tail -n 40 build.log || echo "(no build.log)"

      - name: Verify the build produced real data
        # If both sources block the runner, dashboard.py still writes a valid
        # but nearly-empty page. Failing here means the previous deployment
        # stays live instead of being replaced by an empty board.
        run: |
          ITEMS=$(python - <<'PY'
          import json,re,pathlib
          h=pathlib.Path("index.html").read_text(encoding="utf-8")
          m=re.search(r'<script id="market-data"[^>]*>(.*?)</script>',h,re.S)
          print(len(json.loads(m.group(1))["items"]) if m else 0)
          PY
          )
          echo "Items in payload: $ITEMS"
          if [ "$ITEMS" -lt 5 ]; then
            echo "::error::Only $ITEMS sales scraped - refusing to publish. Keeping the last good deploy."
            exit 1
          fi

      - name: Commit the sales archive
        # The scrape takes ~10 minutes, so the remote can move underneath us
        # (a manual commit, or the previous run finishing). Rebase and retry
        # rather than failing.
        #
        # continue-on-error: publishing the site matters more than storing
        # the archive. If this can't push, the site still deploys and the
        # archive catches up next hour.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json
          if git diff --staged --quiet; then
            echo "Archive unchanged - nothing to commit."
            exit 0
          fi
          git commit -m "Update sales archive [skip ci]"

          for attempt in 1 2 3; do
            if git push; then
              echo "Archive pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected - remote moved. Rebasing (attempt $attempt)..."
            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              # Only the archive can realistically conflict, and only if
              # something else rewrote it during this run. Defer to the
              # remote and drop our archive commit: this is self-healing,
              # because the next run rescrapes a full 30 days and re-merges,
              # whereas force-keeping our copy could discard another run's
              # sales permanently.
              echo "Conflict on the archive - deferring to the remote copy."
              git rebase --abort || true
              git reset --hard "origin/${GITHUB_REF_NAME}" || true
              echo "Archive commit dropped; next run will re-merge."
              exit 0
            fi
          done

          echo "::warning::Could not push the archive after 3 attempts. \
          The site will still deploy; the archive will catch up next run."
          exit 1

      - name: Assemble the site folder
        run: |
          mkdir -p public
          cp index.html public/
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
